<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Box settings</title><link rel="stylesheet" href="ui.css">
<style>
  body { min-height: 100vh; }
  .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  nav.side { padding: 22px 14px; border-right: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .brand .mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary2)); display: grid; place-items: center; color: #fff; box-shadow: 0 8px 18px -8px var(--primary); }
  .navbtn { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font-weight: 600; text-align: left; width: 100%; transition: background .2s, color .2s, transform .15s var(--spring); position: relative; }
  .navbtn:hover { background: var(--bg2); color: var(--text); } .navbtn[aria-current="page"] { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
  .navbtn[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--primary); animation: pop .3s var(--spring); }
  main { padding: 34px 40px 80px; max-width: 920px; width: 100%; }
  main > section { animation: rise .4s var(--ease) both; display: grid; gap: 20px; }
  h1 { margin: 0 0 2px; font-size: 26px; letter-spacing: -.02em; } .lead { margin: 0; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: var(--shadow-sm); display: grid; gap: 14px; }
  .panel h2 { margin: 0; font-size: 15px; } .cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .mode { flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; }
  .mode .title { display: flex; align-items: center; gap: 8px; } .mode .sub { white-space: normal; }
  .svcgrid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  .svclist { display: grid; gap: 6px; max-height: 66vh; overflow: auto; padding: 2px; }
  .svc { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; border: 1.5px solid transparent; background: transparent; text-align: left; width: 100%; transition: all .2s; }
  .svc:hover { background: var(--bg2); } .svc[aria-current="true"] { background: var(--surface); border-color: var(--primary); box-shadow: var(--shadow-md); }
  .svc .ico { width: 32px; height: 32px; border-radius: 10px; background: var(--bg2); display: grid; place-items: center; font-weight: 800; color: var(--muted); flex: none; }
  .domain { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); }
  .domain span.d { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  table { width: 100%; border-collapse: collapse; } td { padding: 8px 4px; border-top: 1px solid var(--border); vertical-align: middle; }
  @media (max-width: 760px) { .shell { grid-template-columns: 1fr; } nav.side { position: static; height: auto; flex-direction: row; overflow: auto; } .svcgrid, .cards3 { grid-template-columns: 1fr; } main { padding: 20px; } }
</style></head>
<body><div class="shell"><nav class="side" id="nav" aria-label="Settings sections"></nav><main id="main"></main></div><script src="settings.js"></script></body></html>
