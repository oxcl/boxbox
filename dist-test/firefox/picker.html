<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Choose an account · Box</title><link rel="stylesheet" href="ui.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(1100px 600px at 15% -10%, color-mix(in srgb, var(--primary) 22%, transparent), transparent 60%), radial-gradient(900px 500px at 100% 110%, color-mix(in srgb, var(--primary2) 20%, transparent), transparent 55%), var(--bg); }
  .panel { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 26px; box-shadow: var(--shadow-lg); padding: 28px; display: grid; gap: 20px; animation: rise .5s var(--ease) both; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 52px; height: 52px; border-radius: 16px; background: var(--surface2); border: 1px solid var(--border); display: grid; place-items: center; font-weight: 800; font-size: 22px; box-shadow: var(--shadow-md); overflow: hidden; }
  h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; } .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { flex-direction: column; align-items: flex-start; gap: 14px; padding: 16px; border-radius: 18px; min-height: 118px; }
  .tile .key { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 700; color: var(--faint); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
  .tile .avatar { width: 44px; height: 44px; border-radius: 14px; }
  .opts { display: flex; align-items: center; gap: 12px; padding-top: 4px; border-top: 1px solid var(--border); padding-top: 16px; }
  .checkbox { display: flex; gap: 10px; align-items: center; cursor: pointer; user-select: none; }
</style></head>
<body><main id="app" class="panel" aria-live="polite"></main><script src="picker.js"></script></body></html>
