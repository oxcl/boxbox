<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Choose a box · BoxBox</title><link rel="stylesheet" href="ui.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 28px; background: radial-gradient(1200px 700px at 15% -10%, #fff 0, transparent 60%), radial-gradient(900px 600px at 100% 100%, var(--bg2) 0, transparent 60%), var(--bg); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: radial-gradient(1100px 650px at 20% -10%, #3a2d20 0, transparent 60%), radial-gradient(900px 600px at 100% 100%, #2a2018 0, transparent 60%), var(--bg); } }
  :root[data-theme="dark"] body { background: radial-gradient(1100px 650px at 20% -10%, #3a2d20 0, transparent 60%), radial-gradient(900px 600px at 100% 100%, #2a2018 0, transparent 60%), var(--bg); }
  main { width: min(1040px, 100%); text-align: center; display: grid; justify-items: center; gap: 6px; }
  .logo { width: 82px; height: 82px; border-radius: 24px; background: var(--card-solid); box-shadow: 0 10px 30px rgba(0, 0, 0, .12), 0 0 0 1px var(--line); display: grid; place-items: center; font-weight: 800; font-size: 40px; overflow: hidden; color: var(--muted); } .logo img { width: 44px; height: 44px; }
  h1 { font-size: clamp(30px, 4.6vw, 48px); letter-spacing: -.035em; margin: 20px 0 6px; line-height: 1.05; }
  .url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; max-width: 70ch; }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; margin: 38px 0 18px; }
  .tile { width: 200px; padding: 28px 14px 20px; gap: 10px; background: transparent; box-shadow: none; }
  .tile:hover, .tile:focus-visible { background: linear-gradient(150deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, .22)); box-shadow: 0 1px 0 rgba(255, 255, 255, .9) inset, 0 0 0 1px rgba(255, 255, 255, .6), 0 10px 26px rgba(80, 60, 30, .1); }
  .tile .bx { --s: 100px; margin: 18px 0 24px; } .tile .title { font-size: 18px; } .tile .sub { white-space: normal; }
  .tile .key { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 800; color: var(--faint); border-radius: 7px; padding: 1px 7px; box-shadow: inset 0 0 0 1px var(--border2); }
  .tile .tick { top: 6px; right: -4px; }
  .remember { display: inline-flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 16px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; }
  .remember input { position: absolute; opacity: 0; } .remember i { width: 26px; height: 26px; border-radius: 9px; box-shadow: inset 0 0 0 2px var(--border2); display: grid; place-items: center; transition: .35s var(--pop); } .remember i svg { width: 15px; height: 15px; stroke-width: 3.4; color: #fff; transform: scale(0); transition: .35s var(--pop); }
  .remember input:checked + i { background: var(--accent); box-shadow: none; transform: scale(1.08); } .remember input:checked + i svg { transform: scale(1); } .remember input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--faint); font-size: 12.5px; margin-top: 16px; }
</style></head>
<body><main id="app" aria-live="polite"></main><script src="picker.js"></script></body></html>
