<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BoxBox</title><link rel="stylesheet" href="ui.css">
<style>
  body { width: 424px; min-height: 140px; max-height: 600px; overflow: hidden; background: var(--bg); }
  #app { padding: 18px 20px 18px; max-height: 600px; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .logo { display: inline-flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; } .logo .mini { --s: 28px; }
  .site { display: flex; align-items: center; gap: 13px; padding: 14px 0 10px; }
  .site .tile { width: 48px; height: 48px; border-radius: 15px; background: var(--card-solid); box-shadow: 0 4px 14px rgba(0, 0, 0, .1), 0 0 0 1px var(--line); display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; overflow: hidden; color: var(--muted); }
  .site .tile img { width: 26px; height: 26px; }
  .site h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; line-height: 1.2; } .site .host { color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 250px; }
  .status { display: flex; align-items: center; gap: 11px; padding: 11px 15px; border-radius: 16px; font-weight: 700; font-size: 15px; background: color-mix(in srgb, var(--c, #9a8a78) 13%, transparent); transition: background .5s; } .status b { color: var(--c, var(--accent2)); } .status .mini { --s: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; padding: 20px 2px 8px; }
  .cell { padding: 18px 4px 12px; gap: 8px; min-height: 120px; justify-content: flex-start; }
  .cell .bx { --s: 54px; margin: 14px 0 8px; } .cell .tick { top: -9px; right: -9px; } .cell .menu { top: 6px; left: 6px; width: 26px; height: 26px; border-radius: 9px; background: var(--card-solid); box-shadow: 0 1px 6px rgba(0, 0, 0, .15); }
  .cell .menu svg { width: 14px; height: 14px; } .cell .warnpip { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--warn); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; } .cell .warnpip.fail { background: var(--danger); }
  .cell.selected { background: linear-gradient(150deg, color-mix(in srgb, var(--c, var(--accent)) 14%, rgba(255, 255, 255, .7)), color-mix(in srgb, var(--c, var(--accent)) 4%, rgba(255, 255, 255, .2))); }
  .cell .name { max-width: 100%; padding: 0 6px; }
  .newcell { min-height: 120px; }
  .foot { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; } .foot p { margin: 0 0 10px; font-weight: 700; color: var(--muted); }
  .empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 26px 10px 20px; } .empty .bx { --s: 84px; margin-bottom: 14px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cell.selected { background: linear-gradient(150deg, color-mix(in srgb, var(--c, var(--accent)) 24%, rgba(40, 32, 24, .9)), color-mix(in srgb, var(--c, var(--accent)) 8%, rgba(40, 32, 24, .9))); } }
  :root[data-theme="dark"] .cell.selected { background: linear-gradient(150deg, color-mix(in srgb, var(--c, var(--accent)) 24%, rgba(40, 32, 24, .9)), color-mix(in srgb, var(--c, var(--accent)) 8%, rgba(40, 32, 24, .9))); }
</style></head>
<body><div id="app"></div><script src="popup.js"></script></body></html>
