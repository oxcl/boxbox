<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoxBox prototype</title>
<link rel="stylesheet" href="shared.css">
<style> body { min-height: 100vh; display: grid; place-items: center; padding: 30px; } .wrap { max-width: 980px; text-align: center; } h1 { font-size: 54px; letter-spacing: -.035em; margin: 18px 0 6px; } p { color: var(--muted); font-size: 18px; margin: 0 0 40px; font-weight: 500; }
 .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; } a.card { display: block; padding: 22px; border-radius: 26px; text-decoration: none; color: inherit; text-align: left; transition: transform .4s var(--ease), box-shadow .3s; } a.card:hover { transform: translateY(-8px) rotate(-.8deg); } a.card .bx { --s: 70px; margin: 8px 0 22px 10px; } a.card h3 { margin: 0 0 4px; font-size: 20px; } a.card span { color: var(--muted); font-weight: 500; font-size: 14px; }</style></head><body>
<div class="bg-scene"><div class="shadow"></div><div class="leaf l1"></div><div class="leaf l2"></div></div>
<div class="wrap"><div id="hero" style="display:inline-block"></div><h1>BoxBox UI prototype</h1><p>Standalone pages, no logic. Click everything, hover everything, tell me what to change.</p><div class="grid" id="g"></div></div>
<script src="motion.js"></script><script src="shared.js"></script><script>
document.getElementById('hero').append(BB.box({ kraft: true, icon: 'box', size: 100, float: true, label: 'BoxBox' }));
[['onboarding.html', 'Welcome', 'Three-step first run', BB.COLORS.orange, 'home'], ['popup.html', 'Toolbar popup', 'Pick a box for this tab, create one, switch modes', BB.COLORS.blue, 'user'], ['picker.html', 'Ask-mode picker', '“Open Google in…” shelf of boxes', BB.COLORS.green, 'flask'], ['services.html', 'Settings', 'Services, accounts, entry modes, proxies', BB.COLORS.purple, 'laptop'], ['browser.html', 'In the page', 'Coloured frame, name pill, tab group, toolbar icon', BB.COLORS.pink, 'heart']].forEach(([h, t, d, c, i], k) => { const a = document.createElement('a'); a.href = h; a.className = 'card glass fade-up'; a.style.animationDelay = k * 80 + 'ms'; a.append(BB.box({ color: c, icon: i, size: 70, label: t.slice(0, 7), float: k % 2 === 0 })); a.insertAdjacentHTML('beforeend', `<h3>${t}</h3><span>${d}</span>`); document.getElementById('g').append(a); });
BB.chrome('index.html');
</script></body></html>
