<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open in…</title>
<link rel="stylesheet" href="shared.css">
<style>
 body { min-height: 100vh; display: flex; flex-direction: column; }
 .browser { width: min(1240px, calc(100% - 40px)); margin: 18px auto 70px; flex: 1; border-radius: 22px; overflow: hidden; background: var(--card-solid); box-shadow: 0 30px 80px rgba(60, 40, 20, .25), 0 0 0 1px var(--line); display: flex; flex-direction: column; min-height: 640px; }

 .shelf .plank { position: absolute; left: 0; right: 0; top: 208px; z-index: 0; }

 .opt .bx { --s: 112px; }

 .remember i { width: 28px; height: 28px; border-radius: 9px; border: 2px solid #c9bfb2; display: grid; place-items: center; transition: .35s var(--ease); background: transparent; } .remember i svg { width: 17px; stroke-width: 3.4; color: #fff; transform: scale(0); transition: .35s var(--ease); } .remember.on i { background: var(--brand); border-color: var(--brand); transform: scale(1.1); } .remember.on i svg { transform: scale(1); }
 /* page reveal */
 .wash, .site { position: absolute; inset: 0; z-index: 10; visibility: hidden; }
 .site { background: var(--card-solid); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
 .siteframe { position: absolute; inset: 0; box-shadow: inset 0 0 0 5px var(--c); pointer-events: none; } .site.none .siteframe, .site.none .sitepill { display: none; }
 .sitepill { position: absolute; left: 50%; top: 0; transform: translate(-50%, 0); display: flex; align-items: center; gap: 8px; padding: 8px 18px 9px 12px; border-radius: 0 0 18px 18px; background: #fff; color: var(--c); font-weight: 800; box-shadow: 0 8px 22px rgba(0,0,0,.16); } .sitepill .bx { --s: 24px; }
 .fakebar { width: min(560px, 70%); height: 54px; border-radius: 99px; background: rgba(120,100,80,.08); box-shadow: inset 0 0 0 1px var(--line); } .sitebtns { display: flex; gap: 12px; } .sitebtns i { width: 120px; height: 38px; border-radius: 12px; background: rgba(120,100,80,.08); }
 /* (legacy) */
 .loading { position: absolute; inset: 0; background: var(--card-solid); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .5s; z-index: 10; } .loading.on { opacity: 1; pointer-events: auto; }
 .loading .l { display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; } .loading .bx { --s: 130px; } .loading.on .bx { animation: ship 1.5s var(--ease) both; }
 @keyframes ship { 0% { transform: translateY(80px) scale(.3); opacity: 0; } 40% { transform: translateY(-10px) scale(1.15); opacity: 1; } 60% { transform: translateY(0) scale(.95); } 100% { transform: translateY(-4px) scale(1); } }
 .loading .dots span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; border-radius: 50%; background: var(--c); animation: dj 1s infinite; } .loading .dots span:nth-child(2) { animation-delay: .15s } .loading .dots span:nth-child(3) { animation-delay: .3s } @keyframes dj { 50% { transform: translateY(-9px); } }
</style></head><body>
<div class="bg-scene"><div class="shadow"></div><div class="leaf l1"></div><div class="leaf l2"></div></div>
<div class="browser">
  <div class="chromebar"><div class="tabs"><div class="traffic" style="padding:0 10px 12px"><i></i><i></i><i></i></div><div class="tab"><span style="color:#4285f4">●</span> New Tab</div></div></div>

    <div class="site" id="site"><div class="siteframe"></div><div class="sitepill" id="sitepill"><span id="sitebox"></span><b id="sitename"></b></div><div class="gtile"><span>G</span></div><div class="fakebar"></div><div class="sitebtns"><i></i><i></i></div><button class="btn ghost" id="back">← Back to the picker</button></div>
  </div>
</div>
<script src="motion.js"></script><script src="shared.js"></script>
<script>
const opts = [{ n: 'No box', d: 'Use your normal browser session', k: true, i: 'home', c: '#a9714b' }, { n: 'Work', d: 'For your job, teams, and work stuff', c: BB.COLORS.blue, i: 'briefcase' }, { n: 'Personal', d: 'Your personal accounts and everyday browsing', c: BB.COLORS.coral, i: 'user' }, { n: 'Research', d: 'For learning, reading and exploring', c: BB.COLORS.green, i: 'flask' }];

  const st = document.createElement('div'); st.className = 'stage'; const b = BB.box(o.k ? { kraft: true, icon: o.i, label: 'default', size: 112, hover: true, lid: true } : { color: o.c, icon: o.i, label: o.n, size: 112, hover: true, glow: false, lid: true }); MO.dropIn(b, 120 + k * 80); st.append(b);
  d.append(st); d.insertAdjacentHTML('beforeend', `<h3>${o.n}</h3><p>${o.d}</p>`); b.classList.toggle('bx-selected', k === sel);

  d.ondblclick = () => ship(o, d);

  MO.A(b, [{ transform: 'translateY(0)' }, { transform: 'translateY(-40px) scale(1.12)', offset: .5 }, { transform: 'translateY(-14px) scale(1)' }], { duration: 650, easing: 'cubic-bezier(.3,.8,.3,1)' });

  setTimeout(() => BB.confetti(innerWidth / 2, innerHeight / 2.4, [o.c || '#c8a06b', '#fff', '#f5c26b'], 14), 1500);

</script></body></html>
